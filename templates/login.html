{% extends 'base.html' %}
{% block title %}Login — Direito Imobiliário{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-4 col-sm-8">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
            <i class="bi bi-journal-bookmark-fill fs-2"></i>
          </div>
          <h4 class="fw-bold mb-0">Direito Imobiliário</h4>
          <p class="text-muted small">Fonte de Consulta</p>
        </div>

        {% if error %}
          <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Senha de acesso</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Digite a senha" autofocus required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
